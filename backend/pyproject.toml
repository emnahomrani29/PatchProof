[project]
name = "patchproof"
version = "0.1.0"
description = "Correction de vulnérabilités prouvée par les tests, avec deux agents IA"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "email-validator>=2.2",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "rq>=1.16",
    "openai>=1.40",
    "docker>=7.1",
    "httpx>=0.27",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "cryptography>=43",
]

[project.optional-dependencies]
rapport = ["weasyprint>=62", "jinja2>=3.1"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["patchproof*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
